name: Build Windows installer

on:
  push:
    branches: [main, claude/proexr-core]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with the installer"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --group build --locked

      - name: Tests (core, no GPU on the runner)
        run: uv run pytest -q --ignore=tests/ui

      - name: Lint
        run: uv run ruff check src tests

      - name: Build app folder
        shell: pwsh
        run: |
          $version = uv run python packaging/write_version_info.py
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          uv run pyinstaller packaging/proexr.spec --noconfirm

      - name: Self-test packaged app
        shell: pwsh
        run: |
          $report = Join-Path $env:RUNNER_TEMP "self-test.txt"
          $process = Start-Process -FilePath "dist\ProEXR Viewer\ProEXR Viewer.exe" -ArgumentList "--self-test", "`"$report`"" -Wait -PassThru
          Get-Content $report
          if ($process.ExitCode -ne 0) { exit 1 }
          if (Select-String -Path $report -Pattern "PortAudio missing") { Write-Error "PortAudio not bundled"; exit 1 }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; }
          & $iscc /DAppVersion=$env:APP_VERSION packaging\installer.iss
          Compress-Archive -Path "dist\ProEXR Viewer" -DestinationPath "dist\ProEXR-Viewer-$env:APP_VERSION-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ProEXR-Viewer-${{ env.APP_VERSION }}-windows
          path: |
            dist/ProEXR-Viewer-Setup-*.exe
            dist/ProEXR-Viewer-*-portable.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release create $tag --target $env:GITHUB_SHA --title "ProEXR Viewer $env:APP_VERSION" --notes-file packaging/RELEASE_NOTES.md "dist/ProEXR-Viewer-Setup-$env:APP_VERSION.exe" "dist/ProEXR-Viewer-$env:APP_VERSION-portable.zip"
