[project]
name = "proexr"
dynamic = ["version"]
description = "Professional read-only media viewer and player for VFX: EXR, image sequences and video"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6-Essentials>=6.6",
    "PyOpenGL>=3.1.7",
    "numpy>=1.26",
    "OpenImageIO>=3.0",
    "av>=14.0",
    "opencolorio>=2.3",
    "sounddevice>=0.4.6",
]

[project.scripts]
proexr = "proexr.app:main"

[project.gui-scripts]
proexr-gui = "proexr.app:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
build = ["pyinstaller>=6.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/proexr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/proexr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
